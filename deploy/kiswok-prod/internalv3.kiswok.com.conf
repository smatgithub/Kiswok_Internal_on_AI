# Place in /etc/apache2/sites-available/ and a2ensite.
# Requires DNS A record internalv3.kiswok.com -> 10.1.1.36
# and: sudo certbot --apache -d internalv3.kiswok.com
# Until certbot, reuse the Internal-API certificate like internalv2.

<VirtualHost *:80>
    ServerName internalv3.kiswok.com
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName internalv3.kiswok.com
    SSLEngine on
    SSLCertificateFile /home/kiswok/Workspace/React_API/src/certificate/certificate.crt
    SSLCertificateKeyFile /home/kiswok/Workspace/React_API/src/certificate/private.key

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/internalv3_error.log
    CustomLog ${APACHE_LOG_DIR}/internalv3_access.log combined
</VirtualHost>
